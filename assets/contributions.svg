<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><rect width="1200" height="520" fill="#F2F0E8"/><rect width="1200" height="9" fill="#EA5A36"/><text x="44" y="67" fill="#242521" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="900">A YEAR, ONE LITTLE BLOCK AT A TIME.</text><text x="45" y="101" fill="#6A655B" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">52 WEEKS OF SHOWING UP. SOME QUIET. SOME CHAOTIC.</text><rect x="45" y="138" width="1110" height="270" rx="10" fill="#B8D0E7" stroke="#242521" stroke-width="2"/><text x="80" y="250" fill="#242521" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900">AWAITING FIRST SYNC</text><text x="80" y="288" fill="#242521" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Contribution skyline appears after the first workflow run.</text><rect x="0" y="484" width="1200" height="36" fill="#242521"/><text x="45" y="508" fill="#F2F0E8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">EACH BLOCK = ONE DAY. HEIGHT = ACTIVITY, NOT QUALITY.</text></svg>