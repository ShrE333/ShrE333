name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real GitHub statistics and draw SVG charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ShrE333
        run: python scripts/generate_stats.py
      - name: Commit refreshed visualizations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public GitHub activity [skip ci]"
            git push
          fi
